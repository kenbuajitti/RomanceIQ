<!doctype html>
<html lang="en">
<head>
<!-- iqgames-responsive-v3 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{{ PRODUCT_NAME }}}</title>
<style>
html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#f0f0f0; }
body { -webkit-user-select:none; user-select:none; }
#unity-canvas { position:fixed; inset:0; display:block; width:100%; height:100%; touch-action:none; outline:none; }
#loading { position:fixed; inset:0; display:grid; place-content:center; text-align:center; gap:16px; font:18px system-ui,sans-serif; color:#222; background:#f0f0f0; }
#loading[hidden] { display:none; }
progress { width:240px; }

/* Browser-native fullscreen button: avoids Unity UI gesture timing on WebGL. */
#web-fullscreen { position:fixed; top:7px; right:252px; z-index:200;
  height:36px; min-width:130px; padding:0 12px; border:1px solid #bca78c;
  border-radius:2px; background:#263452; color:#f3e8d7;
  font:600 15px/1 system-ui,Arial,sans-serif; cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.20); touch-action:manipulation; }
#web-fullscreen:hover, #web-fullscreen:focus-visible { background:#415279; outline:2px solid #e2c19c; outline-offset:1px; }
#web-fullscreen[hidden], #web-fullscreen-message[hidden] { display:none !important; }
#web-fullscreen-message { position:fixed; right:15px; top:62px; z-index:201;
  max-width:min(360px,90vw); padding:12px 14px; background:rgba(22,28,43,.96);
  border:1px solid #d4bb93; color:#fff2df; border-radius:5px;
  font:14px/1.4 system-ui,Arial,sans-serif; box-shadow:0 2px 12px #0007; }
@media (max-width:720px) {
  #web-fullscreen { right:177px; top:8px; height:34px; min-width:78px; padding:0 6px; font-size:12px; }
}
</style>
</head>
<body>
<button id="web-fullscreen" type="button" hidden aria-label="Enter full screen" aria-pressed="false">FULLSCREEN</button>
<div id="web-fullscreen-message" hidden role="status" aria-live="polite"></div>
<canvas id="unity-canvas" tabindex="0" aria-label="RomanceIQ interactive romance"></canvas>
<div id="loading" role="status"><span id="message">Loading RomanceIQ…</span><progress id="progress" max="1" value="0"></progress></div>
<script>
const canvas = document.getElementById('unity-canvas');
const loading = document.getElementById('loading');
const message = document.getElementById('message');
const progress = document.getElementById('progress');
const config = {
  dataUrl: 'Build/{{{ DATA_FILENAME }}}',
  frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
  codeUrl: 'Build/{{{ CODE_FILENAME }}}',
#if SYMBOLS_FILENAME
  symbolsUrl: 'Build/{{{ SYMBOLS_FILENAME }}}',
#endif
  streamingAssetsUrl: 'StreamingAssets',
  companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
  productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
  productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
  matchWebGLToCanvasSize: true
};
function fail(error) { loading.hidden = false; progress.hidden = true; message.textContent = 'Unable to load the game. Please reload the page.'; console.error(error); }
const script = document.createElement('script');
script.src = 'Build/{{{ LOADER_FILENAME }}}';
script.onload = () => createUnityInstance(canvas, config, value => { progress.value = value; })
  .then(instance => { window.unityInstance = instance; loading.hidden = true; canvas.focus(); window.iqShowFullscreenControl(); })
  .catch(fail);
script.onerror = fail;
document.body.appendChild(script);
canvas.addEventListener('pointerdown', () => canvas.focus());
canvas.addEventListener('contextmenu', event => event.preventDefault());
</script>

<script>
// Runs in the actual browser input handler, not from Unity's deferred click loop.
(function () {
  'use strict';
  const toggle = document.getElementById('web-fullscreen');
  const messageBox = document.getElementById('web-fullscreen-message');
  const target = document.documentElement;
  function inFullscreen() {
    return Boolean(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function updateLabel() {
    const full = inFullscreen();
    toggle.textContent = full ? 'EXIT FULL' : (window.innerWidth < 721 ? 'FULL' : 'FULLSCREEN');
    toggle.setAttribute('aria-label', full ? 'Exit full screen' : 'Enter full screen');
    toggle.setAttribute('aria-pressed', String(full));
  }
  function blocked(error) {
    console.warn('[IQ Games] Fullscreen was blocked by the browser or embed.', error || '');
    messageBox.textContent = 'Fullscreen was blocked by this browser or the itch.io embed. On itch.io, use the fullscreen icon below the game; enable it under Edit game → Embed options → Fullscreen button if needed.';
    messageBox.hidden = false;
    updateLabel();
  }
  toggle.addEventListener('click', function (event) {
    // The direct browser click is required for transient user activation.
    event.stopPropagation();
    messageBox.hidden = true;
    try {
      if (inFullscreen()) {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (!exit) { blocked('Browser exitFullscreen API unavailable'); return; }
        const result = exit.call(document);
        if (result && typeof result.catch === 'function') result.catch(blocked);
      } else {
        if (document.fullscreenEnabled === false && document.webkitFullscreenEnabled !== true) {
          blocked('Fullscreen permission disabled for this frame');
          return;
        }
        const enter = target.requestFullscreen || target.webkitRequestFullscreen;
        if (!enter) { blocked('Browser requestFullscreen API unavailable'); return; }
        // Do not await or schedule this call: the click must still be active.
        const result = enter.call(target);
        if (result && typeof result.catch === 'function') result.catch(blocked);
      }
    } catch (error) { blocked(error); }
  });
  document.addEventListener('fullscreenchange', updateLabel);
  document.addEventListener('webkitfullscreenchange', updateLabel);
  document.addEventListener('fullscreenerror', blocked);
  window.addEventListener('resize', updateLabel);
  window.iqShowFullscreenControl = function () { toggle.hidden = false; updateLabel(); };
  updateLabel();
})();
</script>
</body>
</html>
